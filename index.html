<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resizable Circular Frame with Cropping, Zoom, and Download</title>
  <link rel="icon" type="image/png" href="icons8-web-camera-96.png">
  <style>
    :root {
      --bg-color: #f4f4f9;
      --text-color: #333;
      --header-bg: #252525;
      --header-text: #fff;
      --button-bg: #252525;
      --button-text: #fafafa;
      --button-border: #fafafa;
      --button-shadow: #fafafa;
    }

    [data-theme="dark"] {
      --bg-color: #1a1a1a;
      --text-color: #f0f0f0;
      --header-bg: #333;
      --header-text: #fff;
      --button-bg: #444;
      --button-text: #f0f0f0;
      --button-border: #f0f0f0;
      --button-shadow: #f0f0f0;
    }

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    header {
      padding: 20px;
      background-color: var(--header-bg);
      color: var(--header-text);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #themeToggle {
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px;
      margin: 0;
    }

    #themeToggle img {
      width: 24px;
      height: 24px;
      filter: invert(1);
    }

    button {
      font-size: 1.5rem;
      color: var(--button-text);
      text-transform: uppercase;
      padding: 10px 20px;
      border-radius: 10px;
      border: 2px solid var(--button-border);
      background: var(--button-bg);
      box-shadow: 3px 3px var(--button-shadow);
      cursor: pointer;
      margin: 35px 0;
    }

    button:active {
      box-shadow: none;
      transform: translate(3px, 3px);
    }

    input[type="file"] {
      font-size: 1.5rem;
      color: var(--button-text);
      text-transform: uppercase;
      padding: 10px 20px;
      border-radius: 10px;
      border: 2px solid var(--button-border);
      background: var(--button-bg);
      box-shadow: 3px 3px var(--button-shadow);
      cursor: pointer;
      margin: 35px 0;
    }

    input[type="file"]:active {
      box-shadow: none;
      transform: translate(3px, 3px);
    }

    .container {
      position: relative;
      display: inline-block;
      margin-top: 20px;
    }

    .frame {
      position: relative;
      border-radius: 50%;
      overflow: hidden;
      cursor: grab;
    }

    .frame img {
      position: absolute;
      object-fit: cover;
      cursor: grab;
      transform-origin: center center;
    }

    #controls {
      margin-top: 20px;
    }

    #controls label,
    #controls input {
      margin: 5px;
    }

    #downloadButton {
      margin: 20px auto;
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <h1>Resizable Circular Photo Frame</h1>
    <button id="themeToggle" aria-label="Toggle theme">
      <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9ImN1cnJlbnRDb2xvciIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiIGNsYXNzPSJmZWF0aGVyIGZlYXRoZXItc3VuIj48Y2lyY2xlIGN4PSIxMiIgY3k9IjEyIiByPSI1Ij48L2NpcmNsZT48bGluZSB4MT0iMTIiIHkxPSIxIiB4Mj0iMTIiIHkyPSIzIj48L2xpbmU+PGxpbmUgeDE9IjEyIiB5MT0iMjEiIHgyPSIxMiIgeTI9IjIzIj48L2xpbmU+PGxpbmUgeDE9IjQuMjIiIHkxPSI0LjIyIiB4Mj0iNS42NCIgeTI9IjUuNjQiPjwvbGluZT48bGluZSB4MT0iMTguMzYiIHkxPSIxOC4zNiIgeDI9IjE5Ljc4IiB5Mj0iMTkuNzgiPjwvbGluZT48bGluZSB4MT0iMSIgeTE9IjEyIiB4Mj0iMyIgeTI9IjEyIj48L2xpbmU+PGxpbmUgeDE9IjIxIiB5MT0iMTIiIHgyPSIyMyIgeTI9IjEyIj48L2xpbmU+PGxpbmUgeDE9IjQuMjIiIHkxPSIxOS43OCIgeDI9IjUuNjQiIHkyPSIxOC4zNiI+PC9saW5lPjxsaW5lIHgxPSIxOC4zNiIgeTE9IjUuNjQiIHgyPSIxOS43OCIgeTI9IjQuMjIiPjwvbGluZT48L3N2Zz4=" alt="">
    </button>
  </header>
  <main>
    <div class="container">
      <div id="frame" class="frame" style="width: 200px; height: 200px; display: none; border: 2px solid rgba(255, 255, 255, 0.5);">
        <img id="photoDisplay" alt="Uploaded Photo">
      </div>
    </div>
    <div class="file-input-container">
      <input type="file" id="photoInput" accept="image/*" aria-label="Select a photo to upload" style="display: none;">
      <button id="customFileButton">Select Photo</button>
    </div>
    <div id="controls" style="display: none;">
      <label for="frameSize">Frame Size:</label>
      <input type="range" id="frameSize" min="100" max="500" value="200">
      <label for="borderThickness">Border Thickness:</label>
      <input type="range" id="borderThickness" min="0" max="100" value="2">
      <label for="borderTransparency">Border Transparency:</label>
      <input type="range" id="borderTransparency" min="0" max="1" step="0.1" value="0.5">
      <label for="borderGradient">Border Gradient:</label>
      <input type="color" id="borderGradient" value="#ff0000">
      <label for="cropZoom">Crop Zoom:</label>
      <input type="range" id="cropZoom" min="1" max="3" step="0.1" value="1">
    </div>
    <button id="downloadButton" style="display: none;">Download as PNG</button>
  </main>
  <canvas id="canvas" style="display: none;"></canvas>
  <script>
    // Theme management
    const themeToggle = document.getElementById('themeToggle');
    let currentTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', currentTheme);
    
    // Update theme toggle icon based on current theme
    const updateThemeIcon = () => {
      const isDark = currentTheme === 'dark';
      themeToggle.querySelector('img').style.transform = isDark ? 'rotate(180deg)' : 'rotate(0deg)';
      themeToggle.querySelector('img').style.transition = 'transform 0.3s ease';
    };
    
    // Initialize icon state
    updateThemeIcon();

    themeToggle.addEventListener('click', () => {
      currentTheme = currentTheme === 'light' ? 'dark' : 'light';
      document.documentElement.style.transition = 'background-color 0.3s ease, color 0.3s ease';
      document.documentElement.setAttribute('data-theme', currentTheme);
      localStorage.setItem('theme', currentTheme);
      updateThemeIcon();
      
      // Smooth transition for buttons and inputs
      document.querySelectorAll('button, input').forEach(el => {
        el.style.transition = 'background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease';
      });
    });

    const photoInput = document.getElementById('photoInput');
    const photoDisplay = document.getElementById('photoDisplay');
    const frame = document.getElementById('frame');
    const customFileButton = document.getElementById('customFileButton');

    // Connect custom button to file input
    customFileButton.addEventListener('click', () => {
      photoInput.click();
    });

    const frameSizeInput = document.getElementById('frameSize');
    const borderThicknessInput = document.getElementById('borderThickness');
    const borderTransparencyInput = document.getElementById('borderTransparency');
    const borderGradientInput = document.getElementById('borderGradient');
    const cropZoomInput = document.getElementById('cropZoom');
    const controls = document.getElementById('controls');
    const downloadButton = document.getElementById('downloadButton');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let frameSize = 200;
    let borderThickness = 2;
    let borderTransparency = 0.5;
    let zoomLevel = 1;
    let isDragging = false;
    let imgOffset = { x: 0, y: 0 };
    let dragStart = { x: 0, y: 0 };

    // Load and display the photo
    photoInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          photoDisplay.src = e.target.result;
          frame.style.display = 'flex';
          controls.style.display = 'block';
          downloadButton.style.display = 'block';

          // Reset zoom level and offsets
          zoomLevel = 1;
          imgOffset = { x: 0, y: 0 };

          // Adjust initial size of the image to fit the frame
          photoDisplay.onload = () => {
            const imgWidth = photoDisplay.naturalWidth;
            const imgHeight = photoDisplay.naturalHeight;

            const aspectRatio = imgWidth / imgHeight;
            const frameAspectRatio = frameSize / frameSize;

            if (aspectRatio > frameAspectRatio) {
              // Image is wider than the frame
              photoDisplay.style.width = `${frameSize}px`;
              photoDisplay.style.height = 'auto';
            } else {
              // Image is taller or square
              photoDisplay.style.height = `${frameSize}px`;
              photoDisplay.style.width = 'auto';
            }
          };
        };
        reader.readAsDataURL(file);
      }
    });

    // Adjust frame size
    frameSizeInput.addEventListener('input', () => {
      frameSize = frameSizeInput.value;
      frame.style.width = `${frameSize}px`;
      frame.style.height = `${frameSize}px`;

      // Recalculate initial fit for the image
      photoDisplay.onload();
    });

    // Adjust border thickness
    borderThicknessInput.addEventListener('input', () => {
      borderThickness = borderThicknessInput.value;
      frame.style.borderWidth = `${borderThickness}px`;
    });

    // Adjust border transparency
    borderTransparencyInput.addEventListener('input', () => {
      borderTransparency = borderTransparencyInput.value;
      frame.style.borderColor = `rgba(255, 255, 255, ${borderTransparency})`;
    });

    // Adjust border gradient
    borderGradientInput.addEventListener('input', () => {
      const borderGradient = borderGradientInput.value;
      frame.style.borderImageSource = 'none';
      frame.style.borderColor = borderGradient;
      frame.style.borderWidth = `${borderThickness}px`;
    });

    // Adjust crop zoom
    cropZoomInput.addEventListener('input', () => {
      zoomLevel = cropZoomInput.value;
      photoDisplay.style.transform = `scale(${zoomLevel}) translate(${imgOffset.x}px, ${imgOffset.y}px)`;
    });

    // Drag and move the image within the frame
    photoDisplay.addEventListener('mousedown', (event) => {
      isDragging = true;
      dragStart.x = event.clientX - imgOffset.x;
      dragStart.y = event.clientY - imgOffset.y;
      photoDisplay.style.cursor = 'grabbing';
    });

    document.addEventListener('mousemove', (event) => {
      if (isDragging) {
        imgOffset.x = event.clientX - dragStart.x;
        imgOffset.y = event.clientY - dragStart.y;
        photoDisplay.style.transform = `scale(${zoomLevel}) translate(${imgOffset.x}px, ${imgOffset.y}px)`;
      }
    });

    document.addEventListener('mouseup', () => {
      isDragging = false;
      photoDisplay.style.cursor = 'grab';
    });

    // Download the result as PNG
    downloadButton.addEventListener('click', () => {
      const size = parseInt(frameSize);
      canvas.width = size;
      canvas.height = size;

      // Draw circular clip
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size / 2, 0, 2 * Math.PI);
      ctx.closePath();
      ctx.clip();

      // Draw image inside the circle
      const img = new Image();
      img.src = photoDisplay.src;
      img.onload = () => {
        ctx.drawImage(img, 0, 0, size, size);

        // Draw border (outside the circle)
        ctx.restore();
        ctx.beginPath();
        ctx.arc(size / 2, size / 2, size / 2 - borderThickness / 2, 0, 2 * Math.PI);
        ctx.lineWidth = borderThickness;
        ctx.strokeStyle = frame.style.borderColor;
        ctx.stroke();

        // Trigger download
        const link = document.createElement('a');
        link.download = 'circular-frame.png';
        link.href = canvas.toDataURL();
        link.click();
      };
    });
  </script>
</body>
</html>
